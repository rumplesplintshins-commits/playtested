<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Circuit Breaker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090b0a;
      color: #f5f7f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(760px, 92vw);
      padding: 32px;
      border: 1px solid #29312c;
      border-radius: 18px;
      background: #111512;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #a9b5ad;
    }

    .hud {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .hud strong {
      color: #77f29b;
    }

    #menu {
      padding: 40px 20px;
      text-align: center;
      border: 1px solid #29312c;
      border-radius: 14px;
    }

    #start {
      padding: 14px 28px;
      border: 0;
      border-radius: 10px;
      background: #77f29b;
      color: #071009;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #arena {
      position: relative;
      height: 380px;
      overflow: hidden;
      border: 1px solid #29312c;
      border-radius: 14px;
      background: #0c100d;
    }

    #target {
      position: absolute;
      width: 72px;
      height: 72px;
      display: none;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #77f29b;
      color: #071009;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    #message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #a9b5ad;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>Circuit Breaker</h1>

    <p class="subtitle">
      Hit the moving circuit nodes before the timer expires.
    </p>

    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Time: <strong id="time">20</strong></span>
      <span>Status: <strong id="status">Ready</strong></span>
    </div>

    <section id="menu">
      <p>Click the nodes as quickly as you can.</p>
      <button id="start" type="button">Begin Circuit</button>
    </section>

    <section id="arena" class="hidden">
      <button id="target" type="button">HIT</button>
      <div id="message">Find the circuit node.</div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
