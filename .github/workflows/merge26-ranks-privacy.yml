name: Merge 26 ranks-only privacy
on:
  push:
    branches: [feature/merge-26]
  pull_request:
    branches: [v11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/test-merge26-tester-identity.mjs
      - run: node tests/test-merge26-privacy-controls.mjs
      - run: npx tsc --noEmit
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Offline Merge 26 regression suites
        run: |
          node tests/test-merge26.mjs
          node tests/test-merge26-availability.mjs
          node tests/test-merge26-48-hours.mjs
          node tests/test-merge26-feedback-approval.mjs
          node tests/test-merge26-steam-referrals.mjs
          node tests/test-merge26-steam-routes.mjs
          node tests/test-merge26-tester-analytics.mjs
          node tests/test-merge26-security.mjs
          node tests/test-notification-routing.mjs
          node tests/test-build-results-selection.mjs
          node tests/test-pulse-preflight-ssrf.mjs
          node tests/test-pulse-zip-extraction.mjs
      - name: Production build
        run: npm run build
