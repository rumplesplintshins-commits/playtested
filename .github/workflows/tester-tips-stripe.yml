name: Tester tips Stripe integration checks
on:
  pull_request:
    branches: [feature/tester-tips-stripe]
    paths:
      - 'app/api/tester-tips/**'
      - 'app/api/stripe/webhook/route.ts'
      - 'app/components/FeedbackUsefulness.tsx'
      - 'lib/tester-tips/**'
      - 'supabase/migrations/*tester*tip*.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tester-tips-stripe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
