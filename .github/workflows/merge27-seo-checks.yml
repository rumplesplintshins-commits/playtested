name: Merge 27 SEO integration checks
on:
  pull_request:
    branches: [v11]
    paths:
      - 'app/playtesting/**'
      - 'app/find-playtesters/**'
      - 'app/become-a-playtester/**'
      - 'app/guides/**'
      - 'app/components/OrganicGuide.tsx'
      - 'app/seo-social.png/**'
      - 'app/page.tsx'
      - 'app/sitemap.ts'
      - 'lib/organic-search.ts'
      - '.github/workflows/merge27-seo-checks.yml'
      - 'tests/merge27-browser.mjs'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint app/playtesting app/find-playtesters app/become-a-playtester app/guides/playtest-feedback app/components/OrganicGuide.tsx app/seo-social.png/route.tsx app/page.tsx app/sitemap.ts lib/organic-search.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
      - run: npx playwright install --with-deps chromium
      - run: node tests/merge27-browser.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
